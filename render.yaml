services:
  - type: web
    name: caixasimples-bratec-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: commercial-backend
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL_MODE
        value: verify-full
      - key: COMMERCIAL_PUBLIC_URL
        value: https://caixasimples-bratec-api.onrender.com
      - key: ALLOWED_APP_ORIGIN
        value: https://tauri.localhost
      - key: COMMERCIAL_ENVIRONMENT
        value: production
      - key: APP_RELEASE
        value: 1.2.0-beta.1
      - key: RELEASE_CHANNEL
        value: beta
      - key: BETA_MODE
        value: "true"
      - key: BETA_MAX_CUSTOMERS
        value: "5"
      - key: BETA_ADMIN_TOKEN
        sync: false
      - key: BETA_INVITE_PEPPER
        sync: false
      - key: ENTITLEMENT_KEY_ID
        value: cnc-validation-2026-01
      - key: MERCADO_PAGO_MONTHLY_PLAN_ID
        sync: false
      - key: MERCADO_PAGO_ANNUAL_PLAN_ID
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: ENTITLEMENT_PRIVATE_KEY_BASE64
        sync: false
